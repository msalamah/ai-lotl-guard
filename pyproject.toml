[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lotl-guard"
version = "0.1.0"
description = "LotL Guard living-off-the-land detection toolkit"
authors = [
  { name = "LotL Guard Team" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "scikit-learn>=1.5.0",
  "lightgbm>=4.5.0",
  "xgboost>=2.1.1",
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "orjson>=3.10.0",
  "joblib>=1.4.0",
  "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0"
]

[tool.uv]
dev-dependencies = ["pytest>=8.3.0", "ruff>=0.6.0"]
